     после нажатия заказ живёт в переписке, а не в какой-то системе: следить
     за ним придётся руками.

     localStorage: это личные данные, и складывать их в браузер без нужды
     не стоит. Побочный плюс — перерисовка экрана (смена языка, например)

<!-- ==========================================================================
     МЕНЮ, ЦЕНЫ И КОНТАКТЫ. Всё, что нужно менять в обычной жизни — здесь.
     Как это править — написано в README.md.
     Ничего, кроме текста и чисел между кавычками, трогать не нужно.

     ДВА ЯЗЫКА. Русский — основной, казахский лежит рядом в полях с
     суффиксом "_kk":

         "name": "Жемчужный Тай",
         "name_kk": "Інжу Тай",
         "desc": "Молочный чай с тапиоковыми жемчужинами...",
         "desc_kk": "Тапиока меруерттері қосылған сүтті шай..."

     Правило одно: нет поля с "_kk" или оно пустое — показывается русское.
     Поэтому переводить можно по одной позиции, сайт при этом не ломается.
     Так же устроены названия разделов, блок "about", "first_time" и все
     надписи интерфейса в разделе "texts".

     ЧЕГО ПЕРЕВОДИТЬ НЕЛЬЗЯ — три поля работают как ключи, а не как текст:

     1) "name" у позиции. По нему app.js подбирает цвет запасного рисунка
        (регулярки в artSpec написаны по русским словам) и по нему же
        ищутся позиции для блока "first_time".
     2) "ref" в "first_time" — это ссылка на "name" позиции. Должна
        совпадать с русским названием буква в букву, вместе с "ё".
     3) "id" у раздела. К нему привязаны значок в app.js (CAT_ICON),
        палитра рисунка (ART_PAL) и адрес вида "сайт/#fruit-mix".

     Надписи "opens_at" и "closes_at" в "texts" содержат {time} — сюда
     подставляется время. У языков разный порядок слов, поэтому время
     стоит внутри строки, а не приклеивается к ней в коде.

     ФОТОГРАФИИ. Поле "img" — файл из папки menu, один на позицию, общий
     для обоих языков: на снимках нет подписей, только стакан. Убрали
     "img" — на плитке рисуется запасная иллюстрация.

     РАЗМЕРЫ. В ценах размеры записаны буквами "M" и "L" — это ключи, они
     же лежат в корзине. Но гостю буквы ничего не говорят, поэтому на экран
     уходит объём из таблицы "sizes" сразу под "place":
