<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страница не найдена — Dear Box</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#163C8C">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<!-- Страницу сервер показывает по любому неверному адресу, поэтому все
     пути здесь от корня сайта («/logo.svg»), а не относительные, и стили
     свои, а не из styles.css: так она не зависит от того, где открылась.
     Цвета — синий и янтарный из шапки основной страницы. -->
<style>
  @font-face {
    font-family: "Unbounded";
    src: url("/fonts/unbounded-cyr-lat.woff2") format("woff2");
    font-weight: 400 900;
    font-display: swap;
  }
  @font-face {
    font-family: "Manrope";
    src: url("/fonts/manrope-cyr-lat.woff2") format("woff2");
    font-weight: 200 800;
    font-display: swap;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 32px 16px;
    background:
      radial-gradient(120% 90% at 88% 0%, rgba(245, 178, 63, .30) 0%, rgba(245, 178, 63, 0) 55%),
      linear-gradient(170deg, #0E2A66 0%, #163C8C 45%, #10306F 100%);
    color: #FFFFFF;
    font-family: "Manrope", system-ui, sans-serif;
    text-align: center;
  }
  main { max-width: 420px; }
  img { width: 72px; height: 72px; border-radius: 20px; }
  .code {
    margin-top: 22px;
    font-family: "Unbounded", system-ui, sans-serif;
    font-size: 64px;
    font-weight: 800;
    line-height: 1;
    color: #FFD27A;
  }
  h1 {
    margin-top: 14px;
    font-family: "Unbounded", system-ui, sans-serif;
    font-size: 22px;
    font-weight: 700;
  }
  p { margin-top: 10px; color: #D5E0F7; font-size: 15px; line-height: 1.55; }
  p[lang="kk"] { margin-top: 4px; font-size: 13.5px; opacity: .8; }
  a {
    display: inline-flex;
    align-items: center;
    height: 50px;
    margin-top: 26px;
    padding: 0 26px;
    border-radius: 14px;
    background: linear-gradient(160deg, #F5B23F, #E08A2B);
    color: #331902;
    font-weight: 800;
    font-size: 15px;
    text-decoration: none;
  }
  a:focus-visible { outline: 2px solid #FFD27A; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/apple-touch-icon.png" alt="Dear Box">
  <div class="code">404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, в адресе опечатка. Меню, цены и контакты — на главной.</p>
  <p lang="kk">Мұндай бет жоқ. Мәзір, бағалар мен байланыс — басты бетте.</p>
  <a href="/">Открыть меню · Мәзірді ашу</a>
</main>
</body>
</html>
